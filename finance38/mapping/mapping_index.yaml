# MARKET DATA (Yahoo Finance)
# =====================
5:
  name: Total share outstanding
  name_vn: Tổng số cổ phiếu lưu hành
  source: yahoo
  unit: shares
  yahoo_field: sharesOutstanding

23:
  name: Market value of equity
  name_vn: Vốn hóa thị trường
